# Собирает app/ в docker-образ и деплоит его на стенд без единой ручной
# docker-команды. Раннер — свой на этот репозиторий (per-client, заводит
# ops/client-infra при онбординге), исполнение host-режимом (без
# Docker/DinD на самой машине раннера — см. docs/onboarding/README.md,
# "CI-сборка образа"), поэтому и сборка через BuildKit
# (ci-buildkitd — тоже per-client, без privileged), а не docker build.
#
# Триггер только на app/** — коммит на шаге "deploy" ниже трогает
# charts/deployment-demo/values.app-image.yaml, НЕ app/**, поэтому сам
# себя не перезапускает (иначе бесконечный цикл).
name: build-app-image
on:
  push:
    paths:
      - "app/**"

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: build & push (BuildKit, без docker build)
        env:
          DOCKER_HOST: ${{ secrets.DOCKER_HOST }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -eu
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-8)"
          IMAGE="${DOCKER_HOST}/app:${SHORT_SHA}"

          mkdir -p ~/.docker
          cat > ~/.docker/config.json <<EOF
          {"auths":{"${DOCKER_HOST}":{"auth":"$(printf '%s:%s' "$DOCKER_USER" "$DOCKER_PASSWORD" | base64 | tr -d '\n')"}}}
          EOF

          buildctl --addr tcp://ci-buildkitd:1234 build \
            --frontend dockerfile.v0 \
            --local context=app \
            --local dockerfile=app \
            --output "type=image,name=${IMAGE},push=true"

          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: deploy (переписать values.app-image.yaml и запушить)
        env:
          DOCKER_HOST: ${{ secrets.DOCKER_HOST }}
        run: |
          set -eu
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-8)"
          cat > charts/deployment-demo/values.app-image.yaml <<EOF
          # Переписывается автоматически CI (.forgejo/workflows/build.yml)
          # при каждом push в app/** — не редактировать руками, затрётся
          # следующим билдом.
          image:
            repository: ${DOCKER_HOST}/app
            tag: "${SHORT_SHA}"
          # Свой registry приватный — без этого под не сможет запулить образ.
          imagePullSecrets:
            - name: registry-pull-secret
          # Пусто = не переопределять entrypoint образа (тот, что задан в
          # app/Dockerfile) — иначе render.sh дефолтного демо-чарта
          # перезатрёт index.html кастомного образа при старте пода.
          command: []
          EOF

          git config user.email "ci@forgejo.local"
          git config user.name "forgejo-actions"
          git add charts/deployment-demo/values.app-image.yaml
          git commit -m "deploy: app image ${SHORT_SHA} [skip ci]"

          SERVER_HOST="$(echo "${{ github.server_url }}" | sed -E 's#^https?://##')"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@${SERVER_HOST}/${{ github.repository }}.git" "HEAD:${{ github.ref_name }}"
