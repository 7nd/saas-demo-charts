# Собирает и деплоит examples/tenant-api/ — ровно тот же приём, что
# build.yml для app/ (BuildKit через ci-buildkitd, host-режим раннера,
# см. комментарий там же). Отдельный файл, не job в build.yml: путь-фильтр
# в Forgejo Actions общий на весь workflow, не per-job — второй
# независимый триггер требует второго файла.
#
# Отличие от build.yml: деплой не через Flux/values-файл (tenant-api —
# отдельный сервис, не часть чарта deployment-demo), а kubectl apply
# напрямую self-service токеном клиента (K8S_TOKEN/K8S_API_SERVER) — тем
# же, что клиент получил в сводке онбординга. Коммит k8s/deployment.yaml
# перед apply — чтобы то, что в git, и то, что реально применено, не
# расходились (тот же принцип, что values.app-image.yaml в build.yml).
name: build-tenant-api
on:
  push:
    paths:
      - "examples/tenant-api/**"

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: checkout
        run: |
          set -eu
          find . -mindepth 1 -delete 2>/dev/null || true
          AUTH_URL="$(echo "${{ github.server_url }}" | sed -E "s#^(https?://)#\1x-access-token:${{ secrets.GITHUB_TOKEN }}@#")"
          git clone --quiet "${AUTH_URL}/${{ github.repository }}.git" .
          git checkout --quiet "${{ github.sha }}"

      - name: build & push (BuildKit, без docker build)
        env:
          DOCKER_HOST: ${{ secrets.DOCKER_HOST }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -eu
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-8)"
          IMAGE="${DOCKER_HOST}/tenant-api:${SHORT_SHA}"

          mkdir -p ~/.docker
          cat > ~/.docker/config.json <<EOF
          {"auths":{"${DOCKER_HOST}":{"auth":"$(printf '%s:%s' "$DOCKER_USER" "$DOCKER_PASSWORD" | base64 | tr -d '\n')"}}}
          EOF

          buildctl --addr tcp://ci-buildkitd:1234 build \
            --frontend dockerfile.v0 \
            --local context=examples/tenant-api \
            --local dockerfile=examples/tenant-api \
            --output "type=image,name=${IMAGE},push=true"

          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: deploy (kubectl apply self-service токеном клиента)
        env:
          K8S_TOKEN: ${{ secrets.K8S_TOKEN }}
          K8S_API_SERVER: ${{ secrets.K8S_API_SERVER }}
        run: |
          set -eu
          sed -i "s#__IMAGE__#${IMAGE}#" examples/tenant-api/k8s/deployment.yaml

          git config user.email "ci@forgejo.local"
          git config user.name "forgejo-actions"
          git add examples/tenant-api/k8s/deployment.yaml
          git commit -m "deploy: tenant-api image ${IMAGE##*:} [skip ci]"
          AUTH_URL="$(echo "${{ github.server_url }}" | sed -E "s#^(https?://)#\1x-access-token:${{ secrets.GITHUB_TOKEN }}@#")"
          git push "${AUTH_URL}/${{ github.repository }}.git" "HEAD:${{ github.ref_name }}"

          # --insecure-skip-tls-verify: клиенту не выдаём CA-сертификат
          # кластера отдельно (см. сводку onboard_client.py — там только
          # K8S_API_SERVER/K8S_TOKEN), тот же компромисс, что и во всех
          # остальных self-service примерах в этом репозитории.
          # namespace — из владельца репозитория (client-<slug> -> <slug>-saas),
          # self-service токен всё равно имеет права только в нём же.
          NAMESPACE="$(echo "${{ github.repository_owner }}" | sed 's/^client-//')-saas"
          kubectl --server="${K8S_API_SERVER}" --token="${K8S_TOKEN}" --insecure-skip-tls-verify=true \
            -n "${NAMESPACE}" apply -f examples/tenant-api/k8s/deployment.yaml
